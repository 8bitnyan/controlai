version: 2

project_name: controlai

before:
  hooks:
    - go mod tidy

builds:
  - id: controlai
    main: ./cmd/controlai
    binary: controlai
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X controlai/internal/version.Version={{ .Version }}

archives:
  - id: controlai
    ids:
      - controlai
    name_template: "controlai_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - LICENSE*
      - README*
      - src: deploy/install/install.sh
        dst: install.sh
      - src: deploy/systemd/*.service
        dst: systemd/

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto
  mode: replace
