name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    name: Build, Vet, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Tidy
        run: make tidy

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Build controlai
        run: make build

      - name: Build controlai-ingest
        run: make build-ingest

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  deploy-aws-lint:
    name: deploy/aws lint (terraform fmt/validate + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.6.2"

      - name: tofu fmt -check
        run: tofu -chdir=deploy/aws/terraform fmt -check -recursive

      - name: tofu init (no backend)
        run: tofu -chdir=deploy/aws/terraform init -backend=false -input=false

      - name: tofu validate
        run: tofu -chdir=deploy/aws/terraform validate

      - name: shellcheck up.sh / down.sh
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: deploy/aws
          severity: warning
