name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    name: Build, Vet, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Tidy
        run: make tidy

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Build controlai
        run: make build

      - name: Build controlai-ingest
        run: make build-ingest

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  deploy-aws-lint:
    name: deploy/aws lint (terraform fmt/validate + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.6.2"

      - name: tofu fmt -check
        run: tofu -chdir=deploy/aws/terraform fmt -check -recursive

      - name: tofu init (no backend)
        run: tofu -chdir=deploy/aws/terraform init -backend=false -input=false

      - name: tofu validate
        run: tofu -chdir=deploy/aws/terraform validate

      - name: shellcheck deploy/aws shell scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: deploy/aws
          severity: warning
          additional_files: "deploy/aws/scripts/flip-acme-prod.sh deploy/aws/test/test_https_api.sh"

  test-aws-https:
    name: HTTPS API integration test (live AWS)
    # Runs only on deploy/aws/** changes and when INTEGRATION=1 is explicitly set.
    # Skipped in normal CI to avoid incurring AWS costs on every push.
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.modified, 'deploy/aws/') && vars.INTEGRATION == '1' }}
    runs-on: ubuntu-latest
    environment: aws-integration
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl jq gettext-base
          # Install OpenTofu
          curl -fsSL https://get.opentofu.org/install-opentofu.sh | sudo bash -s -- --install-method deb

      - name: Provision ephemeral deployment
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          DEPLOYMENT_NAME: ci-https-${{ github.run_id }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          ACME_STAGING: "1"
        run: |
          AWS_REGION="${AWS_REGION}" DEPLOYMENT_NAME="${DEPLOYMENT_NAME}" \
            ACME_EMAIL="${ACME_EMAIL}" ACME_STAGING="1" \
            ./deploy/aws/up.sh --yes

      - name: Run HTTPS API integration test
        env:
          DEPLOYMENT_NAME: ci-https-${{ github.run_id }}
        run: |
          ./deploy/aws/test/test_https_api.sh --allow-staging

      - name: Tear down ephemeral deployment
        if: always()
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          DEPLOYMENT_NAME: ci-https-${{ github.run_id }}
        run: |
          AWS_REGION="${AWS_REGION}" DEPLOYMENT_NAME="${DEPLOYMENT_NAME}" \
            ./deploy/aws/down.sh --yes
